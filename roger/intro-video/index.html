<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ROGER — Film d'introduction</title>
<link rel="stylesheet" href="style.css">
<script>
  // Aléatoire déterministe : chaque worker de rendu doit produire exactement la même animation.
  (function () {
    let a = 20260926;
    Math.random = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
</head>
<body>
<div id="stage">
  <div id="shake" class="layer">
    <div id="cam" class="layer">
      <div id="sc1" class="layer scene"></div>
      <div id="sc2" class="layer scene"></div>
      <div id="sc3" class="layer scene"></div>
      <div id="sc4" class="layer scene"></div>
      <div id="sc5" class="layer scene"></div>
      <div id="sc6" class="layer scene"></div>
    </div>
  </div>
  <div id="hud" class="layer">
    <div class="hud-t" id="hud-tl">Roger — Film d'introduction</div>
    <div class="hud-t" id="hud-tr">00:00:00:00</div>
    <div class="hud-t" id="hud-bl">01 — Le problème</div>
    <div class="hud-t" id="hud-br">96 BPM · 60 i/s</div>
    <i class="crop" id="c1"></i><i class="crop" id="c2"></i><i class="crop" id="c3"></i><i class="crop" id="c4"></i>
  </div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
<script src="node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="cues.js"></script>
<script src="main.js"></script>
</body>
</html>
