<title>ROGER — Plan d'exécution</title>
<link rel="stylesheet" href="style.css">
<script>
  // Aléatoire déterministe : chaque worker de rendu doit produire exactement la même animation.
  (function () {
    let a = 20260928;
    Math.random = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
</head>
